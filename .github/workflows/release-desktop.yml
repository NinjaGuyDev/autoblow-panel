name: Release Desktop App

# Desktop releases use their own tag namespace. `v*` tags publish the Docker
# image (docker-publish.yml); `desktop-v*` tags publish installers, so the two
# artifacts can be released independently.
on:
  push:
    tags:
      - 'desktop-v*'

permissions:
  contents: write

jobs:
  # Same checks every pull request runs, before anything is built for release
  verify:
    uses: ./.github/workflows/ci.yml

  # Created up front so three parallel platform jobs attach to one release
  # instead of racing to create it
  create-draft:
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create the draft release if it does not exist
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" --notes "Build in progress."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: create-draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # better-sqlite3 is native: the copy npm installed targets Node's ABI, not
      # Electron's, and has to be rebuilt before it can be packaged
      - name: Rebuild native modules for Electron
        run: npx electron-builder install-app-deps

      - name: Read version from tag
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#desktop-v}" >> "$GITHUB_OUTPUT"

      - name: Build renderer, backend and Electron entry
        run: npm run build:desktop

      - name: Package and publish installers
        run: npx electron-builder --${{ matrix.platform }} --publish always --config.extraMetadata.version=${{ steps.version.outputs.version }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # electron-builder leaves the release as a draft so partial uploads are never
  # visible; this fills in the notes and publishes it once all three platforms
  # have attached their installers.
  publish-release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Read version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#desktop-v}" >> "$GITHUB_OUTPUT"

      - name: Build release notes from CHANGELOG.md
        run: npx tsx scripts/extract-changelog.ts "${{ steps.version.outputs.version }}" > release-notes.md

      - name: Publish the release
        run: |
          gh release edit "$GITHUB_REF_NAME" \
            --title "Autoblow Panel Desktop ${{ steps.version.outputs.version }}" \
            --notes-file release-notes.md \
            --draft=false \
            --latest=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
